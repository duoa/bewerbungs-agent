[project]
name = "bewerbungs-agent"
version = "0.1.0"
description = "CLI-based, modular job-application agent — evidence-grounded cover letters and CVs"
requires-python = "==3.11.*"
dependencies = [
    "langfuse>=2.0",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "typer>=0.12",
    "anthropic>=0.25",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "mlflow>=3.11.1",
]

[project.scripts]
jobagent = "bewerbungs_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bewerbungs_agent"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
